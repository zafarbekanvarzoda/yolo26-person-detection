<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>YOLO26 Person Detection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            margin: 20px;
            font-weight: bold;
        }

        #resultVideo {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 8px;
        }

        #statistics {
            margin-top: 30px;
            text-align: left;
        }

        #statistics h2,
        #statistics h3 {
            text-align: center;
        }

        #timeline {
            margin-top: 15px;
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>YOLO26 Person Detection</h1>

        <p>
            Upload a video and detect people using YOLO26n.
        </p>

        <input
            type="file"
            id="videoInput"
            accept="video/*"
        >

        <br>

        <button id="processButton">
            Process Video
        </button>

        <p id="status"></p>

        <video
            id="resultVideo"
            controls
            style="display: none;"
        ></video>


        <!-- Statistics -->

        <div
            id="statistics"
            style="display: none;"
        >

            <h2>Statistics</h2>

            <p id="maxPeople"></p>

            <h3>Timeline</h3>

            <div id="timeline"></div>

        </div>

    </div>


    <script>

        const videoInput =
            document.getElementById("videoInput");

        const processButton =
            document.getElementById("processButton");

        const status =
            document.getElementById("status");

        const resultVideo =
            document.getElementById("resultVideo");

        const statistics =
            document.getElementById("statistics");

        const maxPeople =
            document.getElementById("maxPeople");

        const timeline =
            document.getElementById("timeline");


        function formatTime(seconds) {

            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                Math.floor(seconds % 60);

            return (
                String(minutes).padStart(2, "0") +
                ":" +
                String(remainingSeconds).padStart(2, "0")
            );
        }


        processButton.addEventListener(
            "click",
            async function () {

                const file =
                    videoInput.files[0];


                if (!file) {

                    status.textContent =
                        "Please select a video.";

                    return;
                }


                status.textContent =
                    "Processing video...";

                processButton.disabled =
                    true;


                const formData =
                    new FormData();

                formData.append(
                    "file",
                    file
                );


                try {

                    const response =
                        await fetch(
                            "/upload",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(
                            "Server error:",
                            errorText
                        );

                        status.textContent =
                            "Error while processing video.";

                        processButton.disabled =
                            false;

                        return;
                    }


                    const data =
                        await response.json();


                    /*
                        Show video
                    */

                    resultVideo.src =
                        data.video_url;

                    resultVideo.style.display =
                        "block";


                    /*
                        Show maximum number
                    */

                    maxPeople.textContent =
                        "Maximum people detected: " +
                        data.max_people;


                    /*
                        Clear old timeline
                    */

                    timeline.innerHTML =
                        "";


                    /*
                        Add timeline
                    */

                    data.timeline.forEach(
                        function (item) {

                            const p =
                                document.createElement("p");

                            p.textContent =
                                formatTime(item.time) +
                                " → " +
                                item.people +
                                (
                                    item.people === 1
                                        ? " person"
                                        : " people"
                                );

                            timeline.appendChild(p);

                        }
                    );


                    /*
                        Show statistics
                    */

                    statistics.style.display =
                        "block";


                    status.textContent =
                        "Done!";


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Connection error.";

                }


                processButton.disabled =
                    false;

            }
        );

    </script>

</body>

</html>
